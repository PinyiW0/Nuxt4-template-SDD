name: Main Push CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.22.0]

    steps:
      # action 一律釘 commit SHA（非可變 tag）：tag 可被上游移動，
      # 惡意版本會在持有 secrets 的 job 內執行。升版時連同註解的版本號一起更新。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run generate

      - name: Lint
        run: npm run eslint

      - name: Typecheck
        run: npm run typelint

      # unit test 必須留在 CI：pre-push gate 只跑 E2E，
      # 本機 hook 又能被 --no-verify 繞過，這是唯一擋得住 composable/utils 迴歸的關卡。
      - name: Unit test
        run: npm run test:unit
